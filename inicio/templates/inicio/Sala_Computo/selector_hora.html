<button class="sala-time-trigger sala-time-trigger--compact" type="button" aria-label="{{ titulo }}" aria-haspopup="dialog" aria-expanded="false" data-time-trigger>
    <span data-time-label>Selecciona una hora</span>
    <i class="fa-regular fa-clock" aria-hidden="true"></i>
</button>
<div class="sala-time-popover sala-time-popover--compact" role="dialog" aria-label="{{ titulo }}" hidden>
    <div class="sala-time-picker-heading"><strong>{{ titulo }}</strong></div>
    <div class="sala-time-columns">
        <div class="sala-time-list-field" data-time-list="hours">
            <button class="sala-time-list-trigger" type="button" aria-label="Hora" aria-expanded="false" data-time-list-trigger><span></span><i class="fa-solid fa-chevron-down" aria-hidden="true"></i></button>
            <div class="sala-time-list-options" role="group" aria-label="Hora" hidden></div>
        </div>
        <div class="sala-time-list-field" data-time-list="minutes">
            <button class="sala-time-list-trigger" type="button" aria-label="Minutos" aria-expanded="false" data-time-list-trigger><span></span><i class="fa-solid fa-chevron-down" aria-hidden="true"></i></button>
            <div class="sala-time-list-options" role="group" aria-label="Minutos" hidden></div>
        </div>
        <div class="sala-time-list-field" data-time-list="period">
            <button class="sala-time-list-trigger" type="button" aria-label="Periodo" aria-expanded="false" data-time-list-trigger><span></span><i class="fa-solid fa-chevron-down" aria-hidden="true"></i></button>
            <div class="sala-time-list-options" role="group" aria-label="Periodo" hidden></div>
        </div>
    </div>
    <div class="sala-time-actions"><button class="sala-time-apply" type="button" data-time-apply>Aceptar</button></div>
</div>
