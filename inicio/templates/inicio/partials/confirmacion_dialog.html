<dialog class="app-confirm-dialog" aria-labelledby="appConfirmTitle" aria-describedby="appConfirmMessage">
    <div class="app-confirm-icon" aria-hidden="true">
        <i class="fa-solid fa-clipboard-check"></i>
    </div>
    <h2 id="appConfirmTitle">¿Confirmas esta acción?</h2>
    <p id="appConfirmMessage"></p>
    <div class="app-confirm-actions">
        <button class="app-confirm-cancel" type="button" data-confirm-cancel>Cancelar</button>
        <button class="app-confirm-accept" type="button" data-confirm-accept>Confirmar</button>
    </div>
</dialog>
